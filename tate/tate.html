<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="tate_favicon.ico"/>
<title>oSzoukaua's: Tate</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: #000;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2vh 2vw;
  }

  .postcard {
    position: relative;
    display: flex;
    flex-direction: row;
    gap: 3vw;
    background: #000;
    border: 1px solid #222;
    padding: 2vh 3vw;
    width: 90%;
    box-sizing: border-box;
    overflow: hidden;
    cursor: crosshair;
  }

  .postcard .noise {
    position: absolute;
    inset: 0;
    background-image: url('https://static.vecteezy.com/system/resources/thumbnails/023/806/226/original/vintage-old-television-static-noise-background-old-tv-noise-no-signal-display-error-noise-stock-footage-free-video.jpg');
    opacity: 0.02;
    pointer-events: none;
    z-index: 1;
  }

  .postcard > * {
    position: relative;
    z-index: 2;
  }

  .text-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2vh;
    overflow: hidden;
  }

  h1 {
    font-size: 2em;
    margin: 0;
    letter-spacing: -0.05em;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 1px #aaa;
  }

  h1::after {
    content: '';
    display: block;
    width: 100%;
    height: 1px;
    background: #555;
    margin-top: 0.5em;
  }

  .tagline {
    font-size: 0.9em;
    text-transform: uppercase;
    color: #aaa;
    letter-spacing: 0.05em;
    border-left: 2px solid #555;
    padding-left: 0.8em;
  }

  #controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    align-items: center;
  }

  input, datalist {
    background: #000;
    color: #fff;
    border: 1px solid #555;
    padding: 5px;
    width: 300px;
  }

  input::placeholder {
    color: #777;
  }

  #formats {
    display: grid;
    grid-template-columns: 50px 300px 1fr;
    gap: 5px 10px;
    align-items: center;
    max-height: 60vh;
    overflow-y: auto;
    border-left: 1px dashed #333;
    padding-left: 1em;
    scrollbar-width: thin;
    scrollbar-color: #444 #111;
  }

  #formats::-webkit-scrollbar {
    width: 6px;
  }

  #formats::-webkit-scrollbar-thumb {
    background-color: #444;
  }

  #formats::-webkit-scrollbar-track {
    background-color: #111;
  }

  .format-name {
    justify-self: end;
    color: #fff;
  }

  .format-value {
    overflow-x: auto;
    color: #999;
  }

  button {
    padding: 1px 4px;
    background: #000;
    color: #fff;
    border: 1px solid #999;
    cursor: pointer;
    font-size: 0.8em;
  }

  button:hover {
    background: #444;
  }

  .pre_foot {
    width: 100%;
    color: #fff;
    mix-blend-mode: difference;
    text-transform: lowercase;
    letter-spacing: 0.05em;
    font-size: 0.9em;
    border-top: 1px dotted #444;
    padding-top: 1em;
    margin-top: 1em;
  }

  footer {
    margin-top: auto;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  footer a {
    color: #666;
    font-style: normal;
    text-decoration: none;
    transition: color 0.2s;
    font-weight: 300;
    position: relative;
    padding-left: 1em;
    font-size: 0.9em;
  }

  footer a:first-child {
    padding-left: 0;
  }

  footer a:not(:first-child)::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #666;
    font-weight: 700;
  }

  footer a:hover {
    color: #aaa;
    text-decoration: underline;
  }

  footer a:last-child {
    color: #bbb;
    font-weight: 700;
  }

  #copyNotifier {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #333;
    color: #0f0;
    padding: 8px 12px;
    border-radius: 5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  @media (max-width: 800px) {
    .postcard {
      flex-direction: column;
      padding: 2vh 2vw;
    }
    .image-block {
      width: 100%;
      height: 200px;
      margin-top: 1rem;
    }
    #formats {
      grid-template-columns: 50px 1fr 1fr;
    }
  }
</style>
</head>
<body>
<div class="postcard">
  <div class="noise"></div>
  <div class="text-block">
    <h1>Tate: Time and date</h1>
    <div class="tagline">All day long, Every day, All the time</div>
    <div id="controls">
      <input list="timezones" id="timezoneInput" placeholder="Type or select timezone">
      <button id="downloadBtn">Download all as .txt</button>
    </div>
    <datalist id="timezones"></datalist>
    <div id="formats"></div>
    <div class="pre_foot">Where does all this time go?</div>
    <footer>
      <a href="https://linktr.ee/oSzoukaua" target="_blank">oSzoukaua</a>
      <a href="https://ko-fi.com/oszoukaua" target="_blank">Support me</a>
      <a href="../misc/gmstw/gmstw.html" target="_blank">Gilded mouths starve the world.</a>
    </footer>
  </div>
</div>

<div id="copyNotifier">Copied</div>

<script>
const timezoneInput = document.getElementById('timezoneInput');
const timezonesDatalist = document.getElementById('timezones');
const timezones = Intl.supportedValuesOf('timeZone');

timezones.forEach(tz => {
  const option = document.createElement('option');
  option.value = tz;
  timezonesDatalist.appendChild(option);
});

const notifier = document.getElementById('copyNotifier');
function showNotifier() {
  notifier.style.opacity = 1;
  setTimeout(() => { notifier.style.opacity = 0; }, 1000);
}

const formatTypes = [
  { name: "ISO String", func: d => d.toISOString() },
  { name: "ISO Date Only", func: d => d.toISOString().split('T')[0] },
  { name: "ISO Time Only", func: d => d.toISOString().split('T')[1].split('.')[0] },
  { name: "Locale String", func: (d, tz) => d.toLocaleString('en-US', { timeZone: tz }) },
  { name: "Locale Date", func: (d, tz) => d.toLocaleDateString('en-US', { timeZone: tz }) },
  { name: "Locale Time", func: (d, tz) => d.toLocaleTimeString('en-US', { timeZone: tz }) },
  { name: "UTC String", func: d => d.toUTCString() },
  { name: "RFC 2822", func: d => d.toUTCString().replace('GMT', '+0000') },

  { name: "Date YYYY-MM-DD", func: (d, tz) => new Date(d.toLocaleString('en-US', { timeZone: tz })).toISOString().split('T')[0] },
  { name: "Date MM/DD/YYYY", func: (d, tz) => { const dt = new Date(d.toLocaleString('en-US', { timeZone: tz })); return `${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')}/${dt.getFullYear()}`; } },
  { name: "Date DD/MM/YYYY", func: (d, tz) => { const dt = new Date(d.toLocaleString('en-US', { timeZone: tz })); return `${dt.getDate().toString().padStart(2,'0')}/${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getFullYear()}`; } },
  { name: "Date YYYY/MM/DD", func: (d, tz) => { const dt = new Date(d.toLocaleString('en-US', { timeZone: tz })); return `${dt.getFullYear()}/${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')}`; } },
  { name: "Time HH:MM AM/PM", func: (d, tz) => d.toLocaleTimeString('en-US', { hour12: true, timeZone: tz }) },
  { name: "Time HH:MM (24h)", func: (d, tz) => d.toLocaleTimeString('en-US', { hour12: false, timeZone: tz }).slice(0,5) },
  { name: "Time (HH:MM:SS)", func: (d, tz) => d.toLocaleTimeString('en-US', { hour12: false, timeZone: tz }) },
  { name: "Custom 12h HH:MM:SS", func: (d, tz) => d.toLocaleTimeString('en-US', { hour12: true, second: '2-digit', timeZone: tz }) },
  { name: "Custom 24h HH:MM:SS", func: (d, tz) => d.toLocaleTimeString('en-US', { hour12: false, second: '2-digit', timeZone: tz }) },

  { name: "Unix Timestamp (seconds)", func: d => Math.floor(d.getTime()/1000) },
  { name: "Milliseconds since Epoch", func: d => d.getTime() },
  { name: "Excel Serial Number", func: d => (d - new Date(Date.UTC(1899,11,30)))/86400000 },
  { name: "Julian Day", func: d => Math.floor(d/86400000 + 2440587.5) },

  { name: "Week Number (ISO)", func: d => { const t = new Date(d); const day = (d.getDay()+6)%7; t.setDate(t.getDate()-day+3); const f = new Date(t.getFullYear(),0,4); return 1 + Math.round((t-f)/(7*24*3600*1000)); } },
  { name: "Day of Year", func: d => { const start = new Date(d.getFullYear(),0,0); return Math.floor((d-start+((start.getTimezoneOffset()-d.getTimezoneOffset())*60000))/86400000); } },
  { name: "Week Percentage", func: d => (((d.getDay()+6)%7 + d.getHours()/24)/7*100).toFixed(6)+'%' },
  { name: "Year Percentage", func: d => { const start=new Date(d.getFullYear(),0,0), end=new Date(d.getFullYear()+1,0,0); return ((d-start)/(end-start)*100).toFixed(6)+'%'; } },
  { name: "Month Percentage", func: d => { const start=new Date(d.getFullYear(),d.getMonth(),0), end=new Date(d.getFullYear(),d.getMonth()+1,0); return ((d.getDate()-start.getDate())/(end.getDate()-start.getDate())*100).toFixed(6)+'%'; } },
  { name: "Day Percentage", func: d => ((d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds())/86400*100).toFixed(6)+'%' },
  { name: "Hour Percentage", func: d => ((d.getMinutes()*60 + d.getSeconds())/3600*100).toFixed(6)+'%' },
  { name: "Minute Percentage", func: d => (d.getSeconds()/60*100).toFixed(6)+'%' },

  { name: "Month Name", func: (d, tz) => d.toLocaleString('en-US',{month:'long',timeZone:tz}) },
  { name: "Short Month Name", func: (d, tz) => d.toLocaleString('en-US',{month:'short',timeZone:tz}) },
  { name: "Day Name", func: (d, tz) => d.toLocaleString('en-US',{weekday:'long',timeZone:tz}) },
  { name: "Short Day Name", func: (d, tz) => d.toLocaleString('en-US',{weekday:'short',timeZone:tz}) },

  { name: "Fractional Day", func: d => ((d.getHours()+d.getMinutes()/60+d.getSeconds()/3600)/24).toFixed(6) },
  { name: "Fractional Year", func: d => { const start=new Date(d.getFullYear(),0,1), end=new Date(d.getFullYear()+1,0,1); return ((d-start)/(end-start)).toFixed(8); } },

  { name: "Quarter", func: d => Math.floor((d.getMonth()+3)/3) },
  { name: "Quarter Name", func: d => `Q${Math.floor((d.getMonth()+3)/3)}` },
  { name: "ISO Week Year", func: d => { const t=new Date(d); t.setDate(t.getDate()-((d.getDay()+6)%7)+3); return t.getFullYear(); } },
  { name: "Ordinal Date", func: d => `${d.getDate()}${["th","st","nd","rd"][(d.getDate()%10>3)?0:d.getDate()%10]} ${d.toLocaleString('en-US',{month:'long'})}, ${d.getFullYear()}` },
  { name: "Timezone Offset", func: d => `UTC${(d.getTimezoneOffset()/60>0?"-":"+")+Math.abs(d.getTimezoneOffset()/60)}` },
  { name: "Milliseconds of Second", func: d => d.getMilliseconds() },
  { name: "Seconds of Minute", func: d => d.getSeconds() },
  { name: "Minutes of Hour", func: d => d.getMinutes() },
  { name: "Hours of Day", func: d => d.getHours() },

  { name: "ISO Week Date", func: d => `${d.getFullYear()}-W${formatTypes.find(f=>f.name==="Week Number (ISO)").func(d)}-${d.getDay()+1}` },
  { name: "ISO Ordinal Date", func: d => `${d.getFullYear()}-${formatTypes.find(f=>f.name==="Day of Year").func(d)}` },

  { name: "Binary Time", func: d => `${d.getHours().toString(2).padStart(5,'0')}:${d.getMinutes().toString(2).padStart(6,'0')}:${d.getSeconds().toString(2).padStart(6,'0')}` },
  { name: "Emoji Clock", func: d => ['🕛','🕐','🕑','🕒','🕓','🕔','🕕','🕖','🕗','🕘','🕙','🕚'][d.getHours()%12] },
  { name: "Unix Milliseconds Squared", func: d => Math.pow(d.getTime(),2) },
  { name: "Randomized Time", func: d => `${Math.floor(Math.random()*24).toString().padStart(2,'0')}:${Math.floor(Math.random()*60).toString().padStart(2,'0')}` },
  { name: "Time Until Weekend", func: d => { const now=d.getTime(), day=d.getDay(), daysUntilSaturday=(6-day+7)%7, nextSat=new Date(d.getFullYear(),d.getMonth(),d.getDate()+daysUntilSaturday); nextSat.setHours(0,0,0,0); let diff=Math.floor((nextSat.getTime()-now)/1000); const h=Math.floor(diff/3600); diff%=3600; const m=Math.floor(diff/60); diff%=60; const s=diff; return `${h}h ${m}m ${s}s`; } },

  { name: "Seconds Since Monday 00:00", func: d => { const day=(d.getDay()+6)%7; return day*86400 + d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds(); } },
  { name: "Milliseconds of Year", func: d => d-new Date(d.getFullYear(),0,1) },
  { name: "Half-Hours Today", func: d => Math.floor((d.getHours()*60+d.getMinutes())/30) },

  { name: "Star Trek Stardate", func: d => (d.getFullYear() + ((d-new Date(d.getFullYear(),0,0))/86400000)/1000).toFixed(3) },
  { name: "Hex Time", func: d => `0x${d.getHours().toString(16)}:${d.getMinutes().toString(16)}:${d.getSeconds().toString(16)}` },

  { name: "Sunrise Fraction", func: d => `${((d.getHours()+d.getMinutes()/60)/24*100).toFixed(2)}% of light gone` },
];

const formatsDiv = document.getElementById('formats');
function renderFormats() {
  formatsDiv.innerHTML = '';
  const tz = timezoneInput.value || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now = new Date();
  formatTypes.forEach(f => {
    const nameDiv = document.createElement('div');
    nameDiv.className = 'format-name';
    nameDiv.textContent = f.name + ":";

    const valueDiv = document.createElement('div');
    valueDiv.className = 'format-value';
    valueDiv.textContent = f.func(now, tz);

    const btn = document.createElement('button');
    btn.textContent = '⎘';
    btn.title = 'Copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(valueDiv.textContent);
      showNotifier();
    };

    formatsDiv.appendChild(btn);
    formatsDiv.appendChild(nameDiv);
    formatsDiv.appendChild(valueDiv);
  });
}

document.getElementById('downloadBtn').onclick = () => {
  const tz = timezoneInput.value || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const now = new Date();
  const lines = formatTypes.map(f => `${f.name}: ${f.func(now, tz)}`);
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `time_formats_${tz}.txt`;
  a.click();
  URL.revokeObjectURL(url);
};

timezoneInput.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
setInterval(renderFormats, 1000);
timezoneInput.addEventListener('input', renderFormats);
renderFormats();
</script>
</body>
</html>
