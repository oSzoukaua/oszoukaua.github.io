<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="webhub_favicon.ico" />
<title>oSzoukaua’s Work</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root {
  --bg: #0a0c0a;
  --card: #121412;
  --text: #e8eaf0;
  --muted: #9aa3b2;
  --radius: 6px;
  --accent: #6cf2c2;
  --danger: #f26c6c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

#toolbar {
  position: fixed;
  left: 0;
  top: 0;
  width: 56px;
  height: 100vh;
  background: linear-gradient(to bottom, #2d302e, #0a0c0a);
  display: flex;
  flex-direction: column;
  padding: 4px;
  gap: 10px;
  z-index: 1000;
  border-radius: 8px;
}

.toolbar-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(to bottom, #282d28, #121412);
  border: 2px solid #353836;
  border-radius: 8px;
}

.toolbar-section a,
.toolbar-section button {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 48px;
  height: 48px;
  border-radius: 6px;
  text-decoration: none;
  color: #dce2dc;
  font-size: 20px;
  background: none;
  border: none;
  cursor: pointer;
  position: relative;
}

.toolbar-section a:hover,
.toolbar-section button:hover {
  color: var(--accent);
}

.toolbar-section a .tooltip,
.toolbar-section button .tooltip {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  background: #151922;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}

.toolbar-section a:hover .tooltip,
.toolbar-section button:hover .tooltip {
  opacity: 1;
}

.spacer {
  width: 48px;
  height: 48px;
}

.dash-spacer {
  width: 36px;
  height: 3px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  margin: 4px 0;
}

.toolbar-section input,
#tagFilter {
  display: none;
  position: absolute;
  left: 56px;
  z-index: 10;
}

#tagFilter {
  background: #121412;
  border: 1px solid #374151;
  border-radius: 4px;
  overflow-y: auto;
  padding: 4px;
  font-size: 12px;
  color: var(--text);
  width: 250px;
}

.tag-main {
  margin: 4px 0;
}

.tag-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
}

.tag-header:hover {
  background: rgba(255, 255, 255, 0.05);
}

.tag-main .toggle {
  font-size: 12px;
  opacity: 0.7;
}

.tag-sub {
  display: flex;
  gap: 4px;
  margin: 2px 0;
  padding-left: 10px;
}

.tag-sub span.label {
  flex-grow: 1;
  cursor: pointer;
}

.tag-sub span.status {
  font-weight: bold;
  display: flex;
  gap: 2px;
}

.tag-sub span.status span {
  cursor: pointer;
  padding: 0 2px;
}

#tagFilter::-webkit-scrollbar {
  width: 6px;
}

#tagFilter::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
}

main {
  margin-left: 57px;
  padding: 7px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.5rem;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid #1f2531;
  transition: border-color 0.1s ease, transform 0.1s ease, opacity 0.1s ease;
  cursor: pointer;
  opacity: 0;
}

.card.visible {
  opacity: 1;
}

.card:hover {
  border-color: #2a3242;
  transform: translateY(-2px);
}

.thumb {
  height: 256px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #282d28, #121412);
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-content {
  padding: 0.4rem;
}

.tag-sub-card {
  display: inline-block;
  font-size: 0.6rem;
  color: #fff;
  border: 1px solid #fff;
  margin-right: 3px;
  padding: 0 4px;
  border-radius: 4px;
  margin-bottom: 2px;
}

.tag-sub-card:hover {
  filter: brightness(1.2);
  cursor: help;
}

.title {
  font-size: 0.95rem;
  font-weight: 500;
  margin-bottom: 0.2rem;
}

.desc {
  font-size: 0.8rem;
  color: #c3dbd0;
}

.toolbar-section button.active {
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(108, 242, 194, 0.4);
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="toolbar-section">
    <button id="searchBtn"><i class="fas fa-search"></i><span class="tooltip">Search</span></button>
    <input type="text" id="searchInput" placeholder="Search…" />

    <button id="filterBtn"><i class="fas fa-tags"></i><span class="tooltip">Filter by tags</span></button>
    <div id="tagFilter"></div>

    <button id="colsBtn"><i class="fas fa-columns"></i><span class="tooltip">Columns</span></button>
    <input type="number" id="colsInput" value="5" min="1" max="420" />

    <span class="spacer"></span>
  </div>

  <div class="toolbar-section">
    <a href="#" title="Discord"><i class="fab fa-discord"></i><span class="tooltip">@oSzoukaua</span></a>
    <span class="dash-spacer"></span>
    <a href="https://ko-fi.com/oszoukaua" title="Ko-Fi"><i class="fas fa-heart"></i><span class="tooltip">Support on Ko-Fi</span></a>
    <span class="dash-spacer"></span>
    <a href="https://linktr.ee/oSzoukaua" title="Linktree"><i class="fas fa-link"></i><span class="tooltip">Linktree</span></a>
  </div>

  <div class="toolbar-section">
    <button title="MOTD"><span class="star">*</span><span class="tooltip">Grab Donald trump by the pussy an' call him a fascist! Cuz' we're gettin' fucked!</span></button>
  </div>
</div>

<main>
  <div class="grid" id="projectsGrid"></div>
  <div id="scrollSentinel"></div>
</main>

<script>
const projectsGrid = document.getElementById("projectsGrid");
const searchBtn = document.getElementById("searchBtn");
const filterBtn = document.getElementById("filterBtn");
const colsBtn = document.getElementById("colsBtn");
const searchInput = document.getElementById("searchInput");
const colsInput = document.getElementById("colsInput");
const tagFilter = document.getElementById("tagFilter");

let currentCols = 5;
let searchTerm = "";
let page = 0;
const pageSize = 10;

const tagLibrary = {
  "3D Asset": [
    { name: "character", color: "#8C00FF" },
    { name: "object", color: "#A7B9D6" },
    { name: "background", color: "#60D67B" },
    { name: "misc", color: "#FFC900" },
    { name: "apparel", color: "#825CD6" }
  ],
  "Project Status": [
    { name: "unfinished", color: "#D84E4B" }
  ],
  "Media": [
    { name: "art", color: "#00C689" }
  ],
  "Platform": [
    { name: "vrchat", color: "#00C4FF" },
    { name: "blender", color: "#FF6E00" }
  ]
};

const projects = [
  { title: "Gonca", description: "Gonca 3D character model i made", tags: ["character","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/c637c21f-58b3-464c-8c21-9877d73dd257_cover_image.png", link: "https://ko-fi.com/s/cd86882ffa" },
  { title: "TestBot [ V-1.0 ]", description: "Character 3D model i made", tags: ["character","blender","unfinished"], image: "https://storage.ko-fi.com/cdn/useruploads/display/b450b834-2c61-4c84-b2c5-ada619e04145_8.png", link: "https://ko-fi.com/s/763d2d7086" },
  { title: "Bunto", description: "Character 3D model i made", tags: ["character","blender","unfinished"], image: "https://storage.ko-fi.com/cdn/useruploads/display/6ba431c7-f220-4b58-ad00-fcdb46805e98_viewangle.png", link: "https://ko-fi.com/s/66893d8e5d" },
  { title: "Aeret [R-1.0]", description: "Character 3D model i made", tags: ["character","blender","unfinished"], image: "https://storage.ko-fi.com/cdn/useruploads/display/ea0714f2-eaec-4013-ade1-44a851508686_0.png", link: "https://ko-fi.com/s/8fad5560fa" },
  { title: "Devision8 Revision", description: "Character 3D model i made", tags: ["character","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/35cb7737-2b78-4d2c-962c-5a0f2362abd4_devision8revision1frontview.png", link: "https://ko-fi.com/s/0cc2906ee0" },
  { title: "AnnosRevision1", description: "Character 3D model i made", tags: ["character","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/728aced5-f682-48cc-9048-43e29f8c6532_viewangle.png", link: "https://ko-fi.com/s/7b83e80dec" },
  { title: "UnknownSource", description: "Character 3D model i made", tags: ["character","blender","unfinished"], image: "https://storage.ko-fi.com/cdn/useruploads/display/59b73c70-4864-4d1e-9bc1-7f946ef0e962_referancephoto0.png", link: "https://ko-fi.com/s/5629c95283" },
  { title: "Toon Hats", description: "Some toon hat models i made", tags: ["apperal","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/9bb1a87d-fa57-4a8b-8ace-19af2bdb569e_toonhatsiso.png", link: "https://ko-fi.com/s/3819e6eae1" },
  { title: "Broken Heart", description: "Broken heart 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/99f70067-7a8a-49fc-a51c-c0f0030c7715_viewangle1.png", link: "https://ko-fi.com/s/046a064af3" },
  { title: "Cracked glasses", description: "Cracked glasses 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/eb892223-1ae6-4398-9f24-9d4c4f1b3877_viewangle.png", link: "https://ko-fi.com/s/21cd6abb04" },
  { title: "F r o g L o a f", description: "frog", tags: ["character","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/70bb93f4-a3e3-45e6-abda-4cc9dd96ea27_frogloaf.png", link: "https://ko-fi.com/s/c9eb7050a0" },
  { title: "Artsy landscape Scene", description: "Layered toon style landscape background", tags: ["background","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/bdc08558-a570-4ea2-b8f7-e7577d0046e4_view2.png", link: "https://ko-fi.com/s/f63837e074" },
  { title: "Comfy Bed", description: "Comfy Bed 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/ac28c7c3-6b0a-4c41-b7d0-3d52f19b2504_viewangle4.png", link: "https://ko-fi.com/s/977bfa2fc7" },
  { title: "Gender Symbols", description: "3 different gender icons", tags: ["misc","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/f2675b06-fe23-4041-91bc-0dd7b01d377d_viewangle.png", link: "https://ko-fi.com/s/6b4d1dc8a1" },
  { title: "Cute Water bottle!", description: "bobbl", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/1749ce93-864c-4d50-831e-87d99eb21fe0_bottleyfurmaw.png", link: "https://ko-fi.com/s/7f1d7b01a8" },
  { title: "Check Box", description: "Checkbox models i made", tags: ["misc","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/9f3e8a8a-e21a-443f-a877-62a3b5c71385_viewangleall.png", link: "https://ko-fi.com/s/2eb3974c87" },
  { title: "Low Poly Helmet", description: "Helmet 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/9137231b-efe0-4652-8294-269c14995b20_viewangle2.png", link: "https://ko-fi.com/s/c61cb84889" },
  { title: "Sign Frame", description: "Frame 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/fc3ae167-3b07-47a3-9617-d72fc901407d_viewangle.png", link: "https://ko-fi.com/s/840393537c" },
  { title: "Concrete Bench", description: "Bench 3D model i made", tags: ["object","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/b95ec318-331d-4a22-a0a1-ee33dc54a3ca_viewangle.png", link: "https://ko-fi.com/s/e200867f62" },
  { title: "Robo", description: "Character 3D model i made", tags: ["character","blender","unfinished"], image: "https://storage.ko-fi.com/cdn/useruploads/display/d55a7f6d-edcb-4ffa-88b3-097a0e063233_viewangle.png", link: "https://ko-fi.com/s/c951cb4131" },
  { title: "CarbonCop", description: "Shitty Character 3D model i made", tags: ["character","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/840a20e0-5185-43bb-ba44-0103996de0ef_angleview.png", link: "https://ko-fi.com/s/2e4bbc254b" },
  { title: "Fromg", description: "fog", tags: ["frog","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/93cdea89-2fa2-400a-9908-121633536ac9_3.png", link: "https://ko-fi.com/s/ba426af48a" },
  { title: "49 Phone Wallpapers", description: "Vertical style device wallpapers/art", tags: ["art","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/a286e898-2d1a-4945-9335-8f400e558bbd_blank4gridscollage_1.png", link: "https://ko-fi.com/s/74d4987b41" },
  { title: "VRChat Custom Fallback Avatar", description: "Vrchat avatar, designed to act as a fallback avatar", tags: ["vrchat","blender"], image: "https://storage.ko-fi.com/cdn/useruploads/display/fd79fca7-69ef-4f84-9418-297f2c6c93a9_111.png", link: "https://ko-fi.com/s/1011f20501" }
];

let tagState = {};

Object.keys(tagLibrary).forEach(main => {
  const container = document.createElement("div");
  container.className = "tag-main";
  container.innerHTML = `
    <div class="tag-header">
      <span>${main}</span>
      <span class="toggle">+</span>
    </div>
  `;

  const subContainer = document.createElement("div");
  subContainer.style.display = "none";
  container.appendChild(subContainer);
  tagFilter.appendChild(container);

  container.querySelector(".tag-header").addEventListener("click", () => {
    const toggle = container.querySelector(".toggle");
    const open = subContainer.style.display === "none";
    subContainer.style.display = open ? "block" : "none";
    toggle.textContent = open ? "-" : "+";
  });

  tagLibrary[main].forEach(tag => {
    const row = document.createElement("div");
    row.className = "tag-sub";
    row.innerHTML = `
      <span class="label" style="color:${tag.color}">${tag.name}</span>
      <span class="status">
        <span class="wh">W</span>/<span class="bl">B</span>
      </span>
    `;

    row.querySelector(".wh").addEventListener("click", () => {
      tagState[tag.name] = tagState[tag.name] === "whitelist" ? null : "whitelist";
      updateTagStatus(row, tag.name);
      renderProjects(true);
    });

    row.querySelector(".bl").addEventListener("click", () => {
      tagState[tag.name] = tagState[tag.name] === "blacklist" ? null : "blacklist";
      updateTagStatus(row, tag.name);
      renderProjects(true);
    });

    subContainer.appendChild(row);
  });
});

function updateTagStatus(row, tag) {
  const wh = row.querySelector(".wh");
  const bl = row.querySelector(".bl");
  wh.style.color = tagState[tag] === "whitelist" ? "var(--accent)" : "inherit";
  bl.style.color = tagState[tag] === "blacklist" ? "var(--danger)" : "inherit";
}

function getFilteredProjects() {
  return projects.filter(p => {
    if (searchTerm && !p.title.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    for (const [tag, status] of Object.entries(tagState)) {
      if (status === "whitelist" && !p.tags.includes(tag)) return false;
      if (status === "blacklist" && p.tags.includes(tag)) return false;
    }
    return true;
  });
}

function renderProjects(reset = false) {
  if (reset) {
    projectsGrid.innerHTML = "";
    page = 0;
  }

  const filtered = getFilteredProjects();
  const start = page * pageSize;
  const end = start + pageSize;
  if (start >= filtered.length) return;

  projectsGrid.style.gridTemplateColumns = `repeat(${currentCols}, 1fr)`;

  filtered.slice(start, end).forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => window.open(p.link, "_blank");

    let tagHtml = "";
    p.tags.forEach(tagKey => {
      for (const group in tagLibrary) {
        const t = tagLibrary[group].find(t => t.name === tagKey);
        if (!t) continue;
        tagHtml += `<span class="tag-sub-card" style="border-color:${t.color}; background: color-mix(in srgb, ${t.color} 20%, black 80%)">${tagKey}</span>`;
      }
    });

    card.innerHTML = `
      <div class="thumb"><img src="${p.image}" alt="${p.title}"></div>
      <div class="card-content">
        <div>${tagHtml}</div>
        <div class="title">${p.title}</div>
        <p class="desc">${p.description}</p>
      </div>
    `;

    projectsGrid.appendChild(card);
    requestAnimationFrame(() => card.classList.add("visible"));
  });

  page++;
}

function togglePanel(panel, button) {
  const open = window.getComputedStyle(panel).display === "block";

  [searchInput, tagFilter, colsInput].forEach(p => p.style.display = "none");
  [searchBtn, filterBtn, colsBtn].forEach(b => b.classList.remove("active"));

  if (!open) {
    panel.style.display = "block";
    button.classList.add("active");
  }
}

searchBtn.onclick = () => { togglePanel(searchInput, searchBtn); searchInput.focus(); };
filterBtn.onclick = () => togglePanel(tagFilter, filterBtn);
colsBtn.onclick = () => { togglePanel(colsInput, colsBtn); colsInput.focus(); };

searchInput.oninput = () => { searchTerm = searchInput.value; renderProjects(true); };
colsInput.oninput = () => { currentCols = parseInt(colsInput.value) || 5; renderProjects(true); };

renderProjects();

const sentinel = document.getElementById("scrollSentinel");

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      renderProjects();
    }
  });
}, {
  rootMargin: "200px", // trigger before reaching bottom
});

observer.observe(sentinel);
</script>
</body>
</html>
